spring.application.name=sportbuddy
spring.profiles.active=dev
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/sportbuddy
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=sportbuddy-dev-secret-schimba-in-local-minim-32-caractere
# poza de profil: maximum 2 MB (verificat în UserService); limita de aici oprește fișierele mult mai mari
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# adresa frontend-ului: linkurile din emailuri (confirmare cont, resetare parolă) duc aici
app.frontend-url=http://localhost:5173
# Client ID-ul OAuth de la Google (se pune în application-local.properties). Gol: butonul Google e simulat.
app.google.client-id=
# Emailul (SMTP) se configurează în application-local.properties. Fără el, linkurile apar doar în consolă.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
