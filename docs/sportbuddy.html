join(t){const l=L_(+t.dataset.v);l.pending.push(ME);render();toast('Cerere trimisă organizatorului');
setTimeout(()=>{if(l.pending.includes(ME)){l.pending=l.pending.filter(x=>x!==ME);l.players.push(ME);l.chat.push({u:'Sistem',t:ME+' a fost acceptat.'});toast('Cererea ta a fost acceptată (simulat)');render()}},3000)},
acc(t){const l=L_(+t.dataset.v),p=t.dataset.p;l.pending=l.pending.filter(x=>x!==p);if(l.players.length<l.cap){l.players.push(p);l.chat.push({u:'Sistem',t:p+' a fost acceptat.'})}render()},
rej(t){const l=L_(+t.dataset.v);l.pending=l.pending.filter(x=>x!==t.dataset.p);render()},
send(t){const l=L_(+t.dataset.v),v=$('#ci').value.trim();if(!v)return;l.chat.push({u:ME,t:v});render();
const o=l.players.find(p=>p!==ME);if(o)setTimeout(()=>{l.chat.push({u:o,t:'Perfect, ne vedem acolo!'});if(view.id===l.id)render()},1000)},
rate(t){L_(+t.dataset.v).rated[t.dataset.p]=+t.dataset.n;render()},
sub(t){const l=L_(+t.dataset.v);if(!Object.keys(l.rated).length)return toast('Acordă cel puțin o notă');Object.entries(l.rated).forEach(([p,v])=>{PE[p]=PE[p]?(PE[p]*4+v)/5:v});l.sub=true;render();toast('Review-urile au fost salvate')},
post(){const v=$('#pt').value.trim();if(!v)return;posts.unshift({id:++POST,sp:fs==='all'?$('#psp').value:fs,u:ME,tag:$('#ptag').value,t:v,likes:0,liked:0,cm:[]});render()},
like(t){const p=posts.find(x=>x.id===+t.dataset.v);p.liked=!p.liked;p.likes+=p.liked?1:-1;render()},
cm(t){const id=t.dataset.v,v=$('#c'+id).value.trim();if(!v)return;posts.find(x=>x.id===+id).cm.push({u:ME,t:v});render()},
prof(){$('#pop').classList.add('hide');const n=L.filter(l=>l.ended&&l.players.includes(ME)).length;modal(`<h3>Profil</h3><div class="r"><span class="av" style="width:56px;height:56px;font-size:22px">${esc(ME[0].toUpperCase())}</span><div><b style="font-size:16px">${esc(ME)}</b><div class="mu">Rating: ${rt(PE[ME])}</div><div class="mu">Meciuri jucate: ${n}</div></div></div><p class="mu">Ratingul vine din review-urile primite de la colegii de meci.</p><button class="b o" data-a="x">Închide</button>`)},
set(){$('#pop').classList.add('hide');const th=document.documentElement.dataset.theme||'system';modal(`<h3>Setări cont</h3><div class="f"><label>Temă</label><select id="th"><option value="system" ${th==='system'?'selected':''}>Sistem</option><option value="light" ${th==='light'?'selected':''}>Luminos</option><option value="dark" ${th==='dark'?'selected':''}>Întunecat</option></select></div><div class="r"><button class="b" data-a="th">Salvează</button><button class="b o" data-a="x">Închide</button></div>`)},
th(){const v=$('#th').value;if(v==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=v;modal('')},
prof(t){$('#pop').classList.add('hide');view={t:'profile',u:t.dataset.v||ME};render()},
set(){$('#pop').classList.add('hide');view={t:'settings',sec:'acc'};render()},
sec(t){view.sec=t.dataset.v;render()},
tg(t){ST[t.dataset.v]=!ST[t.dataset.v];render()},
sv(){const a2=+$('#sag').value;if(!$('#sn').value.trim()||a2<16||a2>99)return toast('Numele complet și vârsta (16–99) sunt obligatorii');ST.age=a2;ST.phone=$('#sphn').value;ST.name=$('#sn').value.trim();ST.email=$('#se').value;ST.bio=$('#sb').value;ST.city=$('#sc').value;toast('Modificările au fost salvate')},
pw(){toast('Ai primit un email pentru resetarea parolei (simulat)')},dl(){toast('În aplicația reală se cere confirmarea parolei')},
dm(t){dmw=t.dataset.v;dmo()},
sdm(){const v=$('#di').value.trim();if(!v)return;const w=dmw;(DM[w]=DM[w]||[]).push({u:ME,t:v});dmo();setTimeout(()=>{DM[w].push({u:w,t:'Ok, vorbim mai pe seară.'});if($('#dmc')&&dmw===w)dmo()},1200)},
sadd(t){const l=L_(+t.dataset.v);if(l.st==='locked')return toast('Lobby-ul e confirmat, nu mai intră jucători');if(l.players.length>=l.cap)return toast('Lobby complet');const c=NM.filter(p=>!l.players.includes(p)),p=c[Math.floor(Math.random()*c.length)];l.players.push(p);l.chat.push({u:'Sistem',t:p+' s-a înscris.'});render()},
lock(t){const l=L_(+t.dataset.v),n=l.players.length;if(l.st!=='open')return;if(n<l.min){l.minfail=true;render();return toast('Minimul de '+l.min+' jucători nu e atins')}l.st='locked';l.locked=[...l.players];l.fp=Math.ceil(l.cost/n);l.paid={};l.players.forEach(p=>{if(p!==ME&&Math.random()<.5)l.paid[p]=1});l.chat.push({u:'Sistem',t:`Lobby confirmat cu ${n} jucători. Preț final: ${l.fp} RON/persoană.`});render();toast('Lobby confirmat, prețul e final')},
scan(t){const l=L_(+t.dataset.v),p=$('#sim').value;if(!l.players.includes(p))return;l.players=l.players.filter(x=>x!==p);if(l.st==='locked')pen(l,p,2,'late');else{l.chat.push({u:'Sistem',t:p+' a anulat înainte de confirmare, fără penalizare.'});toast(p+' a anulat fără penalizare')}render()},
leave(t){const l=L_(+t.dataset.v);l.players=l.players.filter(p=>p!==ME);if(l.st==='locked')pen(l,ME,2,'late');else toast('Te-ai retras fără penalizare');view={t:'agenda'};render()},
cancel(t){const l=L_(+t.dataset.v);if(l.st==='locked')pen(l,ME,2,'late');L=L.filter(x=>x.id!==l.id);view={t:'agenda'};render()},
fin(t){const l=L_(+t.dataset.v);if(l.st!=='locked')return toast('Confirmă lobby-ul înainte să îl încheii');l.ended=true;l.st='done';render()},
att(t){const l=L_(+t.dataset.v);document.querySelectorAll('[data-pr]').forEach(c=>{const p=c.dataset.pr,r=RL[p]=RL[p]||{ok:12,late:0,ns:0};if(c.checked)r.ok++;else pen(l,p,1,'ns')});l.att=true;render()},
pay(t){payModal(L_(+t.dataset.v))},
dopay(t){const l=L_(+t.dataset.v),c=$('#cn').value.replace(/\s/g,'');modal('<h3>Se procesează plata...</h3>');setTimeout(()=>{if(c==='4000000000000002'||c.length<13){payModal(l);toast('Plata a fost refuzată. Încearcă alt card.');return}l.paid[ME]=1;PAY.unshift({id:'P'+Date.now().toString().slice(-6),s:l.sport,d:l.date,a:l.fp});modal('');render();toast('Plată reușită: '+l.fp+' RON')},1200)},
am(t){AM=t.dataset.v;if(AM==='in')GU=null;authView()},
gs(t){const s=t.dataset.v,i=ST.sp.indexOf(s);i<0?ST.sp.push(s):ST.sp.splice(i,1);t.classList.toggle('on')},
goog(){if(AM==='in'){ME='Alex Popescu';Object.assign(ST,{name:ME,email:'alex.popescu@gmail.com',age:24});start();toast('Conectat cu Google')}else{GU={n:'Alex Popescu',e:'alex.popescu@gmail.com'};authView()}},
signup(){const n=$('#gn').value.trim(),e=$('#ge').value.trim(),p=GU?'x':$('#gp').value,a=+$('#ga').value,er=$('#gerr');if(!n||!e||!p||!a)return er.textContent='Completează câmpurile marcate cu *.';if(!/^\S+@\S+\.\S+$/.test(e))return er.textContent='Adresa de email nu este validă.';if(!GU&&p.length<6)return er.textContent='Parola trebuie să aibă minim 6 caractere.';if(a<16||a>99)return er.textContent='Trebuie să ai minim 16 ani.';if(!ST.sp.length)return er.textContent='Alege cel puțin un sport.';ST.lvl={};ST.sp.forEach(s=>ST.lvl[s]='Mediu');Object.assign(ST,{name:n,email:e,age:a,phone:$('#gph').value.trim(),city:$('#gc').value});ME=n;CITY=ST.city;start()},
eye(t){const i=t.parentNode.querySelector('input');i.type=i.type==='password'?'text':'password'},
forgot(){toast('ți-am trimis un email pentru resetarea parolei (simulat)')},
apple(){if(AM==='in'){ME='Maria Ionescu';Object.assign(ST,{name:ME,email:'maria.ionescu@icloud.com',age:27});start();toast('Conectat cu iCloud')}else{GU={n:'Maria Ionescu',e:'maria.ionescu@icloud.com'};authView()}}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!e.target.closest('.um'))$('#pop').classList.add('hide');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.a==='ov'?e:t,t)});
document.addEventListener('change',e=>{if(e.target.id==='city'){const n=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase(),m=CT.find(c=>n(c)===n(e.target.value));if(m){CITY=m;render()}else{e.target.value=CITY;toast('Orașul nu a fost găsit')}}if(e.target.id==='sphoto'||e.target.id==='gphoto'){const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>{ST.photo=r.result;const p=$('#gprev');if(p){p.style.background=`url(${r.result}) center/cover`;p.textContent=''}if(ME)render()};r.readAsDataURL(f)}}const k=e.target.dataset.k;if(k){ST[k]=e.target.value;if(k==='theme'){if(ST.theme==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=ST.theme}}if(e.target.dataset.l){if(e.target.value==='Nu joc')delete ST.lvl[e.target.dataset.l];else ST.lvl[e.target.dataset.l]=e.target.value}if(e.target.id==='ns'||e.target.id==='ncity')$('#nf').innerHTML=fopt($('#ncity').value,$('#ns').value)});
document.addEventListener('focusin',e=>{if(e.target.id==='city'){e.target.placeholder=e.target.value;e.target.value=''}});document.addEventListener('focusout',e=>{if(e.target.id==='city'){if(!e.target.value)e.target.value=CITY;e.target.placeholder='Caută oraș'}});
document.addEventListener('input',e=>{if(e.target.id==='fq'){view.q=e.target.value;render();const i=$('#fq');i.focus();i.setSelectionRange(99,99)}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='lu'||e.target.id==='lp')A.login();if(e.target.id==='di')A.sdm();if(e.target.id==='ci'){const b=document.querySelector('[data-a=send]');if(b)A.send(b)}});
</script></body></html>
